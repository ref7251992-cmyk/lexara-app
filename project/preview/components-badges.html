<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:24px;background:#FAFBFB;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font:500 12px/16px var(--font-sans)}
  .b-success{background:#E5F4E5;color:#005C00}
  .b-warning{background:#FFEEDF;color:#8A3000}
  .b-danger{background:#FCE4E8;color:#7A0017}
  .b-info{background:#E3EEFB;color:#0A4F9F}
  .b-neutral{background:var(--n-30);color:var(--fg-1)}
  .b-brand{background:var(--brand-soft);color:var(--brand-ink)}
  .b-accent{background:var(--accent-soft);color:#7A5800}
  .dot{width:6px;height:6px;border-radius:999px;background:currentColor}
  .b-outline{background:transparent;border:1px solid var(--border-strong);color:var(--fg-2)}
</style></head><body>
<span class="badge b-success"><span class="dot"></span>Подписан</span>
<span class="badge b-warning"><span class="dot"></span>Нужна проверка</span>
<span class="badge b-danger"><span class="dot"></span>Высокий риск</span>
<span class="badge b-info"><span class="dot"></span>В переговорах</span>
<span class="badge b-brand">Находка Lexara</span>
<span class="badge b-accent">Совпадение с плейбуком</span>
<span class="badge b-neutral">Черновик</span>
<span class="badge b-outline">v3.2</span>
</body></html>
