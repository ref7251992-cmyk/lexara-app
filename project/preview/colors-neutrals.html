<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:20px;background:#FAFBFB}
  .scale{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
  .stop{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
  .chip{width:100%;aspect-ratio:1/1;border-radius:8px;border:1px solid var(--border)}
  .name{font:600 11px/14px var(--font-sans);color:var(--fg-1)}
  .hex{font:500 10px/13px var(--font-mono);color:var(--fg-2)}
</style></head><body>
<div class="scale">
  <div class="stop"><div class="chip" style="background:#FAFBFB"></div><span class="name">N10</span><span class="hex">#FAFBFB</span></div>
  <div class="stop"><div class="chip" style="background:#EBEDF0"></div><span class="name">N30</span><span class="hex">#EBEDF0</span></div>
  <div class="stop"><div class="chip" style="background:#DFE2E6"></div><span class="name">N40</span><span class="hex">#DFE2E6</span></div>
  <div class="stop"><div class="chip" style="background:#C2C7D0"></div><span class="name">N50</span><span class="hex">#C2C7D0</span></div>
  <div class="stop"><div class="chip" style="background:#A6AEBB"></div><span class="name">N70</span><span class="hex">#A6AEBB</span></div>
  <div class="stop"><div class="chip" style="background:#7A8699"></div><span class="name">N100</span><span class="hex">#7A8699</span></div>
  <div class="stop"><div class="chip" style="background:#505F79"></div><span class="name">N400</span><span class="hex">#505F79</span></div>
  <div class="stop"><div class="chip" style="background:#243757"></div><span class="name">N700</span><span class="hex">#243757</span></div>
  <div class="stop"><div class="chip" style="background:#091E42"></div><span class="name">N900</span><span class="hex">#091E42</span></div>
</div>
</body></html>
