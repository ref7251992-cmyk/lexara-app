<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:24px;background:#F5F6F7;display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  .card{padding:18px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .ttl{font:600 16px/22px var(--font-sans);color:var(--fg-1)}
  .sub{font:400 13px/18px var(--font-sans);color:var(--fg-2);margin-top:2px}
  .meta{display:flex;gap:14px;margin-top:14px;font:500 12px/16px var(--font-mono);color:var(--fg-3)}
  .badge{padding:3px 9px;border-radius:999px;font:500 12px/16px var(--font-sans);background:#FCE4E8;color:#7A0017}
  .badge.ok{background:#E5F4E5;color:#005C00}
</style></head><body>
<div class="card"><div class="row"><span class="ttl">Рамочный договор — Acme</span><span class="badge">Высокий риск</span></div><div class="sub">3 пункта со сдвигами по ответственности.</div><div class="meta"><span>v3.2</span><span>·</span><span>обновлён 14:02</span></div></div>
<div class="card"><div class="row"><span class="ttl">NDA — DataPilot</span><span class="badge ok">Подписан</span></div><div class="sub">Взаимное, срок 24 месяца.</div><div class="meta"><span>v1.0</span><span>·</span><span>подписан 12 мая</span></div></div>
</body></html>
