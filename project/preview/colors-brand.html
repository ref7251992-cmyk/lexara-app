<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:20px;background:#FAFBFB}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .sw{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:12px;background:white;border:1px solid var(--border)}
  .chip{width:48px;height:48px;border-radius:10px;border:1px solid var(--border-strong)}
  .meta{display:flex;flex-direction:column}
  .name{font:600 14px/20px var(--font-sans);color:var(--fg-1)}
  .hex{font:500 12px/16px var(--font-mono);color:var(--fg-2)}
</style></head><body>
<div class="grid">
  <div class="sw"><div class="chip" style="background:#3D3FE2"></div><div class="meta"><span class="name">Бренд · Индиго</span><span class="hex">#3D3FE2</span></div></div>
  <div class="sw"><div class="chip" style="background:#2A2BA0"></div><div class="meta"><span class="name">Бренд 700</span><span class="hex">#2A2BA0</span></div></div>
  <div class="sw"><div class="chip" style="background:#EFE9FF"></div><div class="meta"><span class="name">Бренд мягкий</span><span class="hex">#EFE9FF</span></div></div>
  <div class="sw"><div class="chip" style="background:#1A1B6B"></div><div class="meta"><span class="name">Бренд тёмный</span><span class="hex">#1A1B6B</span></div></div>
  <div class="sw"><div class="chip" style="background:#E8B23B"></div><div class="meta"><span class="name">Акцент · Цитрин</span><span class="hex">#E8B23B</span></div></div>
  <div class="sw"><div class="chip" style="background:#FFF6DC"></div><div class="meta"><span class="name">Акцент мягкий</span><span class="hex">#FFF6DC</span></div></div>
</div>
</body></html>
