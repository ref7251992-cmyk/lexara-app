<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:24px;background:#F5F6F7;display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .menu{background:white;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-md);padding:6px;width:260px}
  .item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font:500 13px/18px var(--font-sans);color:var(--fg-1);cursor:pointer}
  .item:hover{background:var(--n-20)}
  .item.active{background:var(--brand-soft);color:var(--brand-ink)}
  .item.danger{color:var(--danger)}
  .ic{width:16px;height:16px;color:var(--fg-2)}
  .item.active .ic, .item.danger .ic{color:currentColor}
  .kbd{margin-left:auto;font:500 11px/14px var(--font-mono);color:var(--fg-3)}
  .sep{height:1px;background:var(--divider);margin:6px 4px}
  .ttl{font:500 11px/14px var(--font-sans);color:var(--fg-3);text-transform:uppercase;letter-spacing:.04em;padding:8px 10px 4px}
</style></head><body>
<div class="menu">
  <div class="ttl">Договор</div>
  <div class="item"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>Открыть просмотр<span class="kbd">⏎</span></div>
  <div class="item active"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M9 12l2 2 4-4"/></svg>Запустить анализ<span class="kbd">⌘R</span></div>
  <div class="item"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>Экспорт DOCX<span class="kbd">⌘E</span></div>
  <div class="sep"></div>
  <div class="item danger"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>Удалить</div>
</div>
<div class="menu">
  <div class="ttl">Фильтр</div>
  <div class="item"><span class="box" style="width:10px;height:10px;border-radius:3px;background:#B00020"></span>Высокий риск<span class="kbd">12</span></div>
  <div class="item"><span class="box" style="width:10px;height:10px;border-radius:3px;background:#C54600"></span>Нужна проверка<span class="kbd">8</span></div>
  <div class="item"><span class="box" style="width:10px;height:10px;border-radius:3px;background:#007D00"></span>Без замечаний<span class="kbd">41</span></div>
  <div class="sep"></div>
  <div class="item"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>За последние 7 дней</div>
</div>
</body></html>
