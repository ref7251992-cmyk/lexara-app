<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:0;background:#FAFBFB}
  .row{display:grid;grid-template-columns:1fr 1fr 1fr;height:160px}
  .b{display:flex;align-items:flex-end;padding:12px 14px;font:500 12px/16px var(--font-mono);color:var(--fg-2)}
  .calm{background:#FAFBFB;color:var(--fg-1)}
  .aurora{background:linear-gradient(135deg,#EFE9FF 0%,#F2F6FF 50%,#FFFFFF 100%);color:var(--brand-ink)}
  .dark{background:#0A0A12;color:rgba(255,255,255,.7)}
</style></head><body>
<div class="row">
  <div class="b calm">Спокойный фон · по умолчанию</div>
  <div class="b aurora">Мягкая аврора · hero, splash</div>
  <div class="b dark">Тёмный канвас · чат с агентом</div>
</div>
</body></html>
