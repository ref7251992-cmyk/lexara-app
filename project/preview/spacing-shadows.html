<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:32px;background:#F5F6F7;display:flex;gap:32px;flex-wrap:wrap;align-items:flex-end}
  .b{display:flex;flex-direction:column;align-items:center;gap:12px}
  .sq{width:130px;height:80px;background:white;border-radius:16px;display:flex;align-items:center;justify-content:center;font:500 13px/18px var(--font-sans);color:var(--fg-2)}
  .lbl{font:500 11px/14px var(--font-mono);color:var(--fg-2)}
</style></head><body>
<div class="b"><div class="sq" style="box-shadow:var(--shadow-sm)">в покое</div><span class="lbl">shadow-sm</span></div>
<div class="b"><div class="sq" style="box-shadow:var(--shadow-md)">поповер</div><span class="lbl">shadow-md</span></div>
<div class="b"><div class="sq" style="box-shadow:var(--shadow-lg)">модалка</div><span class="lbl">shadow-lg</span></div>
<div class="b"><div class="sq" style="box-shadow:var(--shadow-xl)">палитра команд</div><span class="lbl">shadow-xl</span></div>
<div class="b"><div class="sq glass" style="background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,.25));border-radius:16px">стекло</div><span class="lbl">shadow-glass</span></div>
</body></html>
